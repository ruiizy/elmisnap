name: ElmiSnap

options:
  bundleIdPrefix: com.elmisnap
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES

targets:
  ElmiSnap:
    type: application
    platform: macOS
    sources:
      - path: ElmiSnap
        excludes:
          - Resources/Info.plist
          - Resources/ElmiSnap.entitlements
    info:
      path: ElmiSnap/Resources/Info.plist
      properties:
        CFBundleDisplayName: ElmiSnap
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 ElmiSnap"
    entitlements:
      path: ElmiSnap/Resources/ElmiSnap.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_NAME: ElmiSnap
        PRODUCT_BUNDLE_IDENTIFIER: com.elmisnap.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  ElmiSnapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ElmiSnapTests
    dependencies:
      - target: ElmiSnap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elmisnap.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ElmiSnap:
    build:
      targets:
        ElmiSnap: all
        ElmiSnapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ElmiSnapTests
